name: UI Automation CI

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

    inputs:

      environment:
        description: "Environment to test"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - uat

      browser:
        description: "Browser for single-browser execution"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: "Run browser in headless mode"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      suite:
        description: "Test suite to execute"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - cross-browser


permissions:
  contents: read


jobs:

  ui-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven


      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version


      - name: Resolve execution settings
        shell: bash
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_BROWSER: ${{ github.event.inputs.browser }}
          INPUT_HEADLESS: ${{ github.event.inputs.headless }}
          INPUT_SUITE: ${{ github.event.inputs.suite }}

        run: |

          echo "TEST_ENV=${INPUT_ENVIRONMENT:-qa}" >> "$GITHUB_ENV"

          echo "TEST_BROWSER=${INPUT_BROWSER:-chrome}" >> "$GITHUB_ENV"

          echo "TEST_HEADLESS=${INPUT_HEADLESS:-true}" >> "$GITHUB_ENV"

          echo "TEST_SUITE=${INPUT_SUITE:-normal}" >> "$GITHUB_ENV"


      - name: Show execution configuration
        run: |

          echo "Environment : $TEST_ENV"

          echo "Browser     : $TEST_BROWSER"

          echo "Headless    : $TEST_HEADLESS"

          echo "Suite       : $TEST_SUITE"


      - name: Run Selenium tests
        shell: bash
        run: |

          if [ "$TEST_SUITE" = "cross-browser" ]; then

            echo "Running cross-browser suite"

            mvn --batch-mode clean test \
              -Denv="$TEST_ENV" \
              -Dheadless="$TEST_HEADLESS" \
              -DsuiteXmlFile=testng-crossbrowser.xml

          else

            echo "Running single-browser suite"

            mvn --batch-mode clean test \
              -Denv="$TEST_ENV" \
              -Dbrowser="$TEST_BROWSER" \
              -Dheadless="$TEST_HEADLESS" \
              -DsuiteXmlFile=testng.xml

          fi


      - name: Generate Allure report
        if: always()
        run: |
          mvn --batch-mode allure:report


      - name: Upload test execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            logs/
            screenshots/