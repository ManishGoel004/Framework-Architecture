name: UI Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  ui-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Run Selenium tests
        run: |
          mvn --batch-mode clean test \
            -Denv=qa \
            -Dbrowser=chrome \
            -Dheadless=true

      - name: Generate Allure report
        if: always()
        run: |
          mvn --batch-mode allure:report

      - name: Upload test execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            logs/
            screenshots/