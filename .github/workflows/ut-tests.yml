name: UI Automation CI

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

    inputs:

      environment:
        description: "Environment to test"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - uat

      browser:
        description: "Browser for single-browser execution"
        required: true
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge

      headless:
        description: "Run browser in headless mode"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      suite:
        description: "Execution suite"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - cross-browser

      test_scope:
        description: "Tests to execute"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression


permissions:
  contents: read


jobs:

  ui-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 45


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven


      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version


      - name: Resolve execution settings
        shell: bash

        run: |

          echo "Triggered by: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then

            echo "TEST_ENV=qa" >> "$GITHUB_ENV"
            echo "TEST_BROWSER=chrome" >> "$GITHUB_ENV"
            echo "TEST_HEADLESS=true" >> "$GITHUB_ENV"
            echo "TEST_SUITE=normal" >> "$GITHUB_ENV"
            echo "TEST_GROUPS=smoke" >> "$GITHUB_ENV"

          elif [ "${{ github.event_name }}" = "push" ]; then

            echo "TEST_ENV=qa" >> "$GITHUB_ENV"
            echo "TEST_BROWSER=chrome" >> "$GITHUB_ENV"
            echo "TEST_HEADLESS=true" >> "$GITHUB_ENV"
            echo "TEST_SUITE=normal" >> "$GITHUB_ENV"
            echo "TEST_GROUPS=regression" >> "$GITHUB_ENV"

          elif [ "${{ github.event_name }}" = "schedule" ]; then

            echo "TEST_ENV=qa" >> "$GITHUB_ENV"
            echo "TEST_BROWSER=chrome" >> "$GITHUB_ENV"
            echo "TEST_HEADLESS=true" >> "$GITHUB_ENV"
            echo "TEST_SUITE=cross-browser" >> "$GITHUB_ENV"
            echo "TEST_GROUPS=regression" >> "$GITHUB_ENV"

          else

            echo "TEST_ENV=${{ inputs.environment }}" >> "$GITHUB_ENV"
            echo "TEST_BROWSER=${{ inputs.browser }}" >> "$GITHUB_ENV"
            echo "TEST_HEADLESS=${{ inputs.headless }}" >> "$GITHUB_ENV"
            echo "TEST_SUITE=${{ inputs.suite }}" >> "$GITHUB_ENV"
            echo "TEST_GROUPS=${{ inputs.test_scope }}" >> "$GITHUB_ENV"

          fi


      - name: Show execution configuration
        run: |

          echo "Environment : $TEST_ENV"
          echo "Browser     : $TEST_BROWSER"
          echo "Headless    : $TEST_HEADLESS"
          echo "Suite       : $TEST_SUITE"
          echo "Groups      : $TEST_GROUPS"


      - name: Run Selenium tests
        shell: bash

        run: |

          if [ "$TEST_SUITE" = "cross-browser" ]; then

            echo "Running cross-browser execution"

            mvn --batch-mode clean test \
              -Denv="$TEST_ENV" \
              -Dheadless="$TEST_HEADLESS" \
              -Dgroups="$TEST_GROUPS" \
              -DsuiteXmlFile=testng-crossbrowser.xml

          else

            echo "Running single-browser execution"

            mvn --batch-mode clean test \
              -Denv="$TEST_ENV" \
              -Dbrowser="$TEST_BROWSER" \
              -Dheadless="$TEST_HEADLESS" \
              -Dgroups="$TEST_GROUPS" \
              -DsuiteXmlFile=testng.xml

          fi


      - name: Generate Allure report
        if: always()
        run: |
          mvn --batch-mode allure:report


      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/site/allure-maven-plugin/index.html
    

      - name: Upload test execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/surefire-reports/
            target/allure-results/
            logs/
            screenshots/